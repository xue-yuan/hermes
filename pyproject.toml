[project]
name = "hermes"
version = "0.1.0"
description = "台股分析選股工具：技術面、基本面、籌碼面、機器學習與回測"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "requests>=2.31",
    "pyarrow>=15",
    "typer>=0.12",
    "rich>=13",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "torch>=2.14.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "google-auth>=2.62.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]

[project.scripts]
hermes = "hermes.cli.main:app"
hermes-web = "hermes.api.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ta-lib>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
